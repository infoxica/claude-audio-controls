name: Deploy website
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - if: inputs.environment == 'production'
        run: bun run release:check
      - run: bun run test && bun run build:site && bun scripts/build-feedback-copy.ts
      - if: inputs.environment == 'staging'
        run: bun scripts/prepare-web-assets.ts --staging
      - if: inputs.environment == 'production'
        run: bun scripts/prepare-web-assets.ts
      - run: bunx wrangler deploy --config feedback/worker/wrangler.jsonc --env "$DEPLOY_ENV"
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
